
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="歡迎填寫聯絡表單，我們將盡快與您聯繫。">
  <title>聯絡我們｜需求諮詢</title>

  <style>
    :root {
      --primary: #2457d6;
      --primary-dark: #1944ad;
      --ink: #18243b;
      --muted: #667085;
      --border: #e0e6f0;
      --surface: #ffffff;
      --background: #f3f6fc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--background);
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    .navbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      width: min(1100px, 92%);
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--primary);
      font-size: 21px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .nav-link {
      text-decoration: none;
      color: #475467;
      font-size: 14px;
    }

    .hero {
      padding: 65px 20px 90px;
      text-align: center;
      color: white;
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(255,255,255,.18),
          transparent 30%
        ),
        linear-gradient(135deg, #183b9b, #3977ed);
    }

    .hero-tag {
      display: inline-block;
      padding: 5px 14px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .hero h1 {
      margin: 18px 0 12px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.3;
    }

    .hero p {
      max-width: 620px;
      margin: auto;
      color: rgba(255,255,255,.88);
      font-size: 16px;
    }

    .main {
      width: min(1000px, 92%);
      margin: -48px auto 70px;
      position: relative;
    }

    .layout {
      display: grid;
      grid-template-columns: 0.8fr 1.4fr;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(27, 52, 100, .12);
    }

    .info {
      padding: 38px 30px;
      color: white;
      background: #172b55;
    }

    .info h2 {
      font-size: 24px;
      margin: 0 0 14px;
    }

    .info > p {
      color: #d4ddef;
      font-size: 14px;
    }

    .info-item {
      margin-top: 30px;
    }

    .info-label {
      font-size: 12px;
      color: #aebfe0;
      letter-spacing: 1px;
    }

    .info-value {
      margin-top: 5px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .form-panel {
      padding: 38px;
    }

    .form-panel h2 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .form-intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 19px 16px;
    }

    .field {
      min-width: 0;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: #d92d20;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 47px;
      padding: 12px 13px;
      border: 1px solid #d0d7e5;
      border-radius: 9px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36,87,214,.12);
    }

    textarea {
      min-height: 135px;
      resize: vertical;
    }

    .privacy {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-weight: 400;
      color: #475467;
      font-size: 13px;
    }

    .privacy input {
      width: 17px;
      height: 17px;
      min-height: auto;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .submit-btn {
      width: 100%;
      min-height: 51px;
      margin-top: 23px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .submit-btn:focus-visible {
      outline: 3px solid #9bb6ff;
      outline-offset: 3px;
    }

    .note {
      margin: 13px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      padding: 25px 15px;
      text-align: center;
      color: #667085;
      font-size: 13px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    /* 隱藏的防垃圾欄位 */
    .honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .hero {
        padding: 48px 18px 75px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .info {
        padding: 28px 25px;
      }

      .info-item {
        margin-top: 18px;
      }

      .form-panel {
        padding: 27px 21px;
      }
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .nav-inner {
        min-height: 62px;
      }

      .brand {
        font-size: 18px;
      }

      .main {
        width: 94%;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="./">CONTACT US</a>
      <a class="nav-link" href="#contact-form">聯絡我們</a>
    </div>
  </header>

  <section class="hero">
    <span class="hero-tag">GET IN TOUCH</span>
    <h1>讓我們了解您的需求</h1>
    <p>
      無論您有任何問題、合作想法或服務需求，
      歡迎填寫下方表單，我們會盡快與您聯繫。
    </p>
  </section>

  <main class="main">
    <div class="layout">

      <aside class="info">
        <h2>與我們聯絡</h2>
        <p>
          請提供您的聯絡方式與需求，
          讓我們能更有效率地回覆您。
        </p>

        <div class="info-item">
          <div class="info-label">EMAIL</div>
          <div class="info-value">
            61213272@gm.chihlee.edu.tw
          </div>
        </div>

        <div class="info-item">
          <div class="info-label">SERVICE</div>
          <div class="info-value">需求諮詢與聯絡表單</div>
        </div>

        <div class="info-item">
          <div class="info-label">RESPONSE</div>
          <div class="info-value">我們收到資料後將盡快回覆</div>
        </div>
      </aside>

      <section class="form-panel" id="contact-form">
        <h2>填寫聯絡表單</h2>
        <p class="form-intro">
          請填寫以下資料，標示
          <span class="required">*</span>
          的欄位為必填。
        </p>

        <form
          action="https://formsubmit.co/61213272@gm.chihlee.edu.tw"
          method="POST"
        >
          <!-- 信件主旨 -->
          <input
            type="hidden"
            name="_subject"
            value="網站收到新的聯絡表單"
          >

          <!-- 使用表格格式呈現信件 -->
          <input
            type="hidden"
            name="_template"
            value="table"
          >

          <!-- 記錄表單來源網址 -->
          <input
  type="hidden"
  name="_url"
  value="https://61213272-svg.github.io/my-contact-website/"
>

          <!-- 防止機器人亂填 -->
          <div class="honeypot" aria-hidden="true">
            <label for="website">請勿填寫此欄位</label>
            <input
              id="website"
              type="text"
              name="_honey"
              tabindex="-1"
              autocomplete="off"
            >
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="name">
                姓名 <span class="required">*</span>
              </label>
              <input
                id="name"
                name="姓名"
                type="text"
                placeholder="請輸入您的姓名"
                autocomplete="name"
                maxlength="80"
                required
              >
            </div>

            <div class="field">
              <label for="phone">聯絡電話</label>
              <input
                id="phone"
                name="聯絡電話"
                type="tel"
                placeholder="例如：0912345678"
                autocomplete="tel"
                maxlength="30"
              >
            </div>

            <div class="field full">
              <label for="email">
                電子郵件 <span class="required">*</span>
              </label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                maxlength="254"
                required
              >
            </div>

            <div class="field full">
              <label for="category">
                諮詢類型 <span class="required">*</span>
              </label>
              <select
                id="category"
                name="諮詢類型"
                required
              >
                <option value="">請選擇需求類型</option>
                <option value="一般問題">一般問題</option>
                <option value="網站製作">網站製作</option>
                <option value="SEO 網站行銷">SEO 網站行銷</option>
                <option value="業務合作">業務合作</option>
                <option value="其他需求">其他需求</option>
              </select>
            </div>

            <div class="field full">
              <label for="message">
                留言內容 <span class="required">*</span>
              </label>
              <textarea
                id="message"
                name="留言內容"
                placeholder="請描述您的問題或需求..."
                minlength="5"
                maxlength="3000"
                required
              ></textarea>
            </div>

            <div class="field full">
              <label class="privacy" for="privacy">
                <input
                  id="privacy"
                  name="同意個人資料使用說明"
                  type="checkbox"
                  value="是"
                  required
                >
                <span>
                  我同意為回覆本次詢問之目的，
                  提供上述聯絡資料供網站管理者使用。
                  <span class="required">*</span>
                </span>
              </label>
            </div>
          </div>

          <button class="submit-btn" type="submit">
            送出表單 →
          </button>

          <p class="note">
            請確認資料正確後再送出。
          </p>
        </form>
      </section>

    </div>
  </main>

  <footer class="footer">
    © 2026 聯絡我們｜All Rights Reserved.
  </footer>
</body>
</html>
